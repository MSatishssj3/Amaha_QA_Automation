[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf-core"
version = "0.1.0"
description = "Reusable MTF (Margin Trading Facility) calculations: max shares under a borrow limit, broker interest slabs, watchlist and live-price loading."
readme = "mtf_core/README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
live = ["yfinance"]

[tool.setuptools]
packages = ["mtf_core"]

[tool.setuptools.package-data]
mtf_core = ["rates.json", "README.md"]

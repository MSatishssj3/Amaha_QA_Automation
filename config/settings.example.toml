# trading-bots settings. `bots init` copies this to config/settings.toml.
#
# The config bot owns this file: edits on the dashboard are validated, versioned (with rollback) and
# written back here. You can also edit it by hand: the config bot imports the file when it starts
# and the bots pick up the change. Unknown keys are errors, so a typo is reported instead of ignored.
# Times are IST; money is in rupees unless a name says otherwise.

[system]                       # read at start; changes need `bots run --all` again
data_dir = "data"
log_dir = "logs"
bus_backend = "sqlite"         # "sqlite" (no extra software) or "redis" (pip install 'tradingbots[redis]')
redis_url = "redis://127.0.0.1:6379/0"
bus_retention_hours = 48.0

[platform]
name = "simulated"             # "simulated" (built-in market, no account) or "dhan"
dhan_auth = "token"            # "token" (paste daily) or "totp" (automatic login: DHAN_PIN + DHAN_TOTP_SECRET)
simulated_speed = 1.0
token_valid_until = "16:00"    # the config bot keeps the Dhan token valid until at least this time

# Watchlist: what the market-data bot streams and the history and AI bots analyse.
# Indices use segment "IDX_I" and need their security id (NIFTY 50 = 13).
[[watchlist]]
symbol = "NIFTY"
segment = "IDX_I"
security_id = 13
mode = "ticker"

[[watchlist]]
symbol = "RELIANCE"
segment = "NSE_EQ"
mode = "quote"

[[watchlist]]
symbol = "HDFCBANK"
segment = "NSE_EQ"
mode = "quote"

[[watchlist]]
symbol = "INFY"
segment = "NSE_EQ"
mode = "quote"

[market_data]
quote_interval_ms = 250        # at most one quote update per instrument this often
bar_timeframes = ["1m"]
snapshot_interval_s = 60.0     # positions, holdings, funds, orders and trades
ledger_lookback_days = 30
record_raw = false

[schedule]
history_refresh = "16:00"      # daily candles and trend metrics
history_years = 2.0
ai_runs = ["08:45", "12:30", "15:45"]   # pre-open, midday, post-close (trading days)
money_interval_s = 300.0
compaction = "23:30"
budget_summary = "15:45"

[ai]                           # advisory only: nothing the AI writes ever becomes an order
enabled = true
provider = "anthropic"         # "anthropic" (needs ANTHROPIC_API_KEY) or "stub" (rule-based demo reports)
model = "claude-opus-5-5"
effort = "high"                # low | medium | high | xhigh | max
daily_usd_budget = 1.0         # runs that would go over this are skipped
max_stocks = 25
max_output_tokens = 24000
refusal_fallbacks = true       # if Claude declines a request, retry it on Anthropic's recommended model
nightly_batch = false          # per-stock deep dives through the Batches API, at half price
deep_dive_at = "19:30"
timeout_s = 900.0

[ai.prices]                    # US$ per million tokens, for cost tracking
input = 4.0
output = 20.0
cache_read = 0.2
cache_write = 5.0

[budget]                       # the daily budget gatekeeper; 0 means no limit for that rule
enabled = true
daily_capital_limit_inr = 100000.0   # total value of new entries today (the engine's and yours)
max_capital_in_use_inr = 150000.0    # open exposure + working entries at any moment
per_stock_daily_limit_inr = 50000.0
per_stock_overrides = {}             # e.g. { RELIANCE = 75000.0 }
per_platform_daily_limit_inr = {}    # e.g. { dhan = 100000.0 }
max_trades_per_day = 20
max_trades_per_stock = 5
max_daily_loss_inr = 2000.0          # reaching it halts the trading engine for the day
alert_at_pct = [80.0, 100.0]
count_manual_trades = true           # your own trades in the Dhan app use up the budget too
fail_mode = "closed"                 # "closed": no fresh budget -> no new entries; "last_known"
policy_max_age_s = 600.0

[money]
sector_map_file = ""           # optional CSV: symbol,sector
usd_inr = 85.0                 # to book the AI cost in rupees
expense_categories = ["data subscription", "server / VPS", "AI API", "software", "advisory", "other"]

[execution]                    # run your dhan_bot strategy inside the team (with the budget guard)
enabled = false
dhanbot_config = "config/dhanbot.toml"
live = false                   # real orders need this AND mode = "live" in the dhan_bot config

[notify]                       # Telegram + email; credentials in .env (TELEGRAM_*, SMTP_*, EMAIL_*)
enabled = true
telegram = true                # instant alerts + commands from your chat (/status, /budget, /pause ...)
email = true                   # the daily summary, plus alerts at email_min_level and above
min_level = "WARNING"          # Telegram gets alerts at this level and above ...
info_keys = ["exec-started", "exec-day-report", "budget-summary", "ai-report", "ai-deep-dive"]  # ... + these INFO
dedupe_minutes = 10.0          # the same alert at most once per 10 minutes
quiet_hours = ["22:00", "07:00"]  # IST; only ERROR alerts in this window ([] = never quiet)
daily_summary_at = "15:50"     # IST, trading days
email_min_level = "ERROR"
commands = true                # /flatten and /kill always need /confirm

[tax]                          # estimated Indian tax on your trades - an estimate for your CA, not tax advice
enabled = true
slab_rate_pct = 30.0           # YOUR marginal slab rate: intraday (speculative) and F&O income are taxed at it
stcg_rate_pct = 20.0           # tax year 2026-27, listed equity with STT paid (Finance (No. 2) Act 2024;
ltcg_rate_pct = 12.5           #   unchanged for 2026-27 under the Income-tax Act, 2025)
ltcg_exemption_inr = 125000.0  # long-term gains exempt each financial year
surcharge_pct = 0.0            # your surcharge rate by income; capped at 15 on these capital gains
cess_pct = 4.0                 # health and education cess
long_term_months = 12          # listed shares are long-term when held MORE than 12 months
history_from = ""              # fetch trade history from YYYY-MM-DD; "" = start of the previous financial year

[dashboard]
address = "127.0.0.1"          # keep it local; use an SSH tunnel to reach it on a server
port = 8501
refresh_s = 2.0
session_minutes = 720

# Dashboard look: the reference palette's surfaces and ink, in light and dark (the viewer picks in the
# Streamlit menu; the default follows the operating system).
[server]
headless = true
runOnSave = false
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"

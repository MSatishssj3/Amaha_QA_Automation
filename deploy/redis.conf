# Redis for the trading-bots message bus. Optional: the default bus is SQLite (no extra software).
# Use it with system.bus_backend = "redis" (or TRADINGBOTS_BUS_BACKEND=redis).
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Keep the bus (streams, settings snapshot, heartbeats) across restarts.
appendonly yes
appendfsync everysec
save 900 1

# Never evict bus data silently: the bots trim their own streams (MAXLEN + system.bus_retention_hours).
maxmemory 512mb
maxmemory-policy noeviction
